 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - ADE Natural Cereals</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
      overflow: hidden;
      padding: 20px;
    }
    .login-wrapper::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(255, 105, 180, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(212, 175, 55, 0.06) 0%, transparent 40%),
        radial-gradient(ellipse at 50% 80%, rgba(255, 105, 180, 0.05) 0%, transparent 40%);
      pointer-events: none;
    }
    .login-card {
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 105, 180, 0.2);
      border-radius: 24px;
      padding: 48px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 60px rgba(255, 105, 180, 0.06);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #D4AF37, #F0D68A, #D4AF37);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 16px;
      box-shadow: 0 0 50px rgba(212, 175, 55, 0.25);
    }
    .login-logo h1 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 3px;
      margin-bottom: 4px;
    }
    .login-logo p {
      color: var(--gray-500);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gray-500);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .form-input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--white);
      font-size: 0.9rem;
      transition: var(--transition-fast);
    }
    .form-input:focus {
      outline: none;
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(255,105,180,0.1);
      background: rgba(255,255,255,0.06);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--pink-gradient);
      color: white;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      border-radius: 9999px;
      margin-top: 8px;
      transition: var(--transition-smooth);
      box-shadow: var(--pink-glow);
    }
    .btn-login:hover {
      box-shadow: 0 0 60px rgba(255,105,180,0.5);
      transform: translateY(-2px);
    }
    .login-back {
      text-align: center;
      margin-top: 20px;
    }
    .login-back a {
      color: var(--gray-500);
      font-size: 0.85rem;
      transition: var(--transition-fast);
    }
    .login-back a:hover { color: var(--pink); }
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">🌾</div>
        <h1>ADE NATURAL CEREALS</h1>
        <p>Admin Portal</p>
      </div>
      
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" class="form-input" id="username" placeholder="Enter your username" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-login">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>
      
      <div class="login-back">
        <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Store</a>
      </div>
    </div>
  </div>
  
  <div class="toast-container" id="toast-container"></div>
  
  <script>
    function showToast(message, type = 'error') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(120%)';
        toast.style.transition = 'all 0.35s ease';
        setTimeout(() => toast.remove(), 350);
      }, 3500);
    }
    
    function checkAuth() {
      const session = sessionStorage.getItem('adeAdminSession');
      if (session) {
        try {
          const data = JSON.parse(session);
          const admins = JSON.parse(localStorage.getItem('adeAdmins') || '[]');
          const admin = admins.find(a => a.email === data.email && a.status === 'active');
          if (admin) {
            window.location.href = admin.role === 'superadmin' ? 'superadmin.html' : 'dashboard.html';
          }
        } catch(e) {}
      }
    }
    
    checkAuth();
    
    function handleLogin(event) {
      event.preventDefault();
      const usernameInput = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      
      if (!usernameInput || !password) {
        showToast('Please fill in all fields', 'error');
        return;
      }
      
      const admins = JSON.parse(localStorage.getItem('adeAdmins') || '[]');
      const admin = admins.find(a => (a.username || a.email) === usernameInput && a.status === 'active');
      
      if (!admin) {
        showToast('Invalid credentials', 'error');
        return;
      }
      
      if (admin.password && admin.password !== password) {
        showToast('Invalid password', 'error');
        return;
      }
      
      const session = JSON.stringify({ email: admin.email });
      sessionStorage.setItem('adeAdminSession', session);
      localStorage.setItem('adeCurrentAdmin', JSON.stringify(admin));
      showToast('Login successful!', 'success');
      setTimeout(() => {
        const admins = JSON.parse(localStorage.getItem('adeAdmins') || '[]');
        const admin = admins.find(a => a.email === data.email && a.status === 'active');
        if (admin && admin.role === 'superadmin') {
          window.location.href = 'superadmin.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      }, 800);
    }
  </script>
</body>
</html>
